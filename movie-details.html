 
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Details | LARPTIX</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="details.css">
</head>

<body>

    <!-- NAVIGATION BAR -->

    <header class="navbar">

        <h1 class="logo">LARPTIX</h1>

        <nav>

            <a href="index.html">Home</a>

            <a href="index.html#movies">Movies</a>

            <a href="my-bookings.html">My Bookings</a>

            <button
                class="login-btn"
                id="auth-btn"
                type="button">
                LOGIN
            </button>

        </nav>

    </header>


    <!-- MOVIE DETAILS -->

    <main class="details-page">

        <a href="index.html#movies" class="back-btn">
            ← Back to Movies
        </a>


        <!-- MOVIE HERO -->

        <section class="details-hero">

            <div class="poster-container">

                <img
                    id="movie-image"
                    src=""
                    alt="Movie Poster">

            </div>


            <div class="details-info">

                <h1 id="movie-name">
                    Movie Name
                </h1>


                <p class="movie-rating">

                    <span class="star">★</span>

                    <span id="movie-rating">0.0</span>

                    <span class="rating-out-of">/ 10</span>

                </p>


                <p id="movie-genre">Movie Genre</p>


                <div class="movie-meta">

                    <span id="movie-year">Year</span>

                    <span id="movie-duration">Duration</span>

                    <span id="movie-language">Language</span>

                </div>


                <h3>About the Movie</h3>

                <p id="movie-description">
                    Movie description appears here.
                </p>


                <button id="book-ticket" type="button">
                    Book Tickets
                </button>

            </div>

        </section>


        <!-- DIRECTOR SECTION -->

        <section class="director-section">

            <h2>Director</h2>

            <div class="director-card">

                <img
                    id="director-image"
                    src=""
                    alt="Director">

                <div
                    id="director-placeholder"
                    style="display: none;">
                </div>

                <h3 id="director-name">
                    Director Name
                </h3>

                <p>Director</p>

            </div>

        </section>


        <!-- CAST SECTION -->

        <section class="cast-section">

            <h2>Cast &amp; Crew</h2>

            <div
                class="cast-container"
                id="cast-list">
            </div>

        </section>

    </main>


    <!-- JAVASCRIPT -->

    <script src="auth.js"></script>
    <script src="details.js"></script>

</body>

</html>
