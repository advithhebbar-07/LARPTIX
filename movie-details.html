 
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Details | LARPTIX</title>

    <!-- MAIN WEBSITE CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- MOVIE DETAILS CSS -->
    <link rel="stylesheet" href="details.css">

</head>

<body>

    <!-- ============================= -->
    <!-- NAVIGATION BAR -->
    <!-- ============================= -->

    <header class="navbar">

        <h1 class="logo">LARPTIX</h1>

        <nav>

            <a href="index.html">Home</a>

            <a href="index.html#movies">Movies</a>

            <a href="#">My Bookings</a>

            <button class="login-btn">
                Login
            </button>

        </nav>

    </header>


    <!-- ============================= -->
    <!-- MOVIE DETAILS -->
    <!-- ============================= -->

    <main class="details-page">


        <!-- BACK BUTTON -->

        <a href="index.html#movies" class="back-btn">
            ← Back to Movies
        </a>


        <!-- ============================= -->
        <!-- MOVIE HERO SECTION -->
        <!-- ============================= -->

        <section class="details-hero">


            <!-- MOVIE POSTER -->

            <div class="poster-container">

                <img
                    id="movie-image"
                    src=""
                    alt="Movie Poster"
                >

            </div>


            <!-- MOVIE INFORMATION -->

            <div class="details-info">


                <h1 id="movie-name">
                    Movie Name
                </h1>


                <!-- RATING -->

                <p class="movie-rating">

                    <span class="star">★</span>

                    <span id="movie-rating">
                        0.0
                    </span>

                    <span class="rating-out-of">
                        / 10
                    </span>

                </p>


                <!-- GENRE -->

                <p id="movie-genre">
                    Movie Genre
                </p>


                <!-- MOVIE METADATA -->

                <div class="movie-meta">

                    <span id="movie-year">
                        Year
                    </span>

                    <span id="movie-duration">
                        Duration
                    </span>

                    <span id="movie-language">
                        Language
                    </span>

                </div>


                <!-- DESCRIPTION -->

                <h3>About the Movie</h3>

                <p id="movie-description">
                    Movie description appears here.
                </p>


                <!-- BOOKING BUTTON -->

                <button id="book-ticket">
                    Book Tickets
                </button>


            </div>

        </section>



        <!-- ============================= -->
        <!-- DIRECTOR SECTION -->
        <!-- ============================= -->

        <section class="director-section">

            <h2>Director</h2>


            <div class="director-card">


                <!-- DIRECTOR PHOTO -->

                <img
                    id="director-image"
                    src=""
                    alt="Director"
                >


                <!-- FALLBACK INITIAL -->

                <div
                    id="director-placeholder"
                    style="display: none;"
                >
                </div>


                <!-- DIRECTOR NAME -->

                <h3 id="director-name">
                    Director Name
                </h3>


                <p>Director</p>


            </div>

        </section>



        <!-- ============================= -->
        <!-- CAST SECTION -->
        <!-- ============================= -->

        <section class="cast-section">

            <h2>Cast &amp; Crew</h2>


            <!-- ACTOR CARDS GENERATED BY JAVASCRIPT -->

            <div
                class="cast-container"
                id="cast-list"
            >

            </div>

        </section>


    </main>



    <!-- ============================= -->
    <!-- JAVASCRIPT -->
    <!-- ============================= -->

    <script src="details.js"></script>


</body>

</html>
